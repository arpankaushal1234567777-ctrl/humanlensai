<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>HumanLens AI</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 14px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11px;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
    }
    .subtitle {
      font-size: 10px;
      color: #10b981;
      font-family: monospace;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 11px;
      line-height: 1.4;
      color: #a1a1aa;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .val-online {
      color: #10b981;
      font-weight: 600;
    }
    .btn {
      width: 100%;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      background: #e4e4e7;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">HL</div>
    <div>
      <div class="title">HumanLens AI</div>
      <div class="subtitle">&bull; Active Protection</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span>Cloud API:</span>
      <span class="val-online">Connected</span>
    </div>
    <div class="status-row">
      <span>Render ML:</span>
      <span class="val-online">Active</span>
    </div>
    <div class="status-row">
      <span>Coverage:</span>
      <span style="color:#fff;">Gmail &bull; Slack &bull; WA</span>
    </div>
  </div>

  <button class="btn" id="openDashboard">Open Web Command Center &rarr;</button>

  <script src="popup.js"></script>
</body>
</html>
